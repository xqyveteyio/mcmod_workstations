import org.gradle.jvm.tasks.Jar

plugins {
	id 'com.gradleup.shadow' version '9.6.1'
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

loom {
	accessWidenerPath = project(':common').loom.accessWidenerPath

	neoForge {
		convertAccessWideners(tasks.named('shadowJar', Jar), 'villager_workstations.accesswidener')
	}
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common
}

dependencies {
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
	implementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

	common(project(path: ':common')) { transitive false }
	shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }
}

processResources {
	inputs.property 'version', project.version

	from(project(':common').sourceSets.main.resources) {
		include 'villager_workstations.accesswidener'
	}

	filesMatching('META-INF/neoforge.mods.toml') {
		expand 'version': project.version
	}
}

jar {
	archiveClassifier = 'raw'
}

shadowJar {
	exclude 'fabric.mod.json'
	exclude 'architectury.common.json'
	dependsOn jar
	mainSpec.sourcePaths.clear()
	from zipTree(jar.archiveFile)
	configurations = [project.configurations.shadowCommon]
	archiveClassifier = null
}

assemble.dependsOn shadowJar

sourcesJar {
	def commonSources = project(':common').sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}

shadow.addShadowVariantIntoJavaComponent = false
