plugins {
id 'fabric-loom' version '0.12.53'
id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
archivesName = project.archives_base_name
}

repositories {
maven {
name = 'Aliyun'
url = 'https://maven.aliyun.com/repository/public'
}
mavenCentral()
}

dependencies {
minecraft "com.mojang:minecraft:${project.minecraft_version}"
mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

// Minecraft Comes Alive integration is intentionally removed for 1.16.5.
// Workers always use their own textures and are not dressed as MCA villagers.
}

processResources {
inputs.property "version", project.version

filesMatching("fabric.mod.json") {
expand "version": inputs.properties.version
}
}

tasks.withType(JavaCompile).configureEach {
it.options.encoding = "UTF-8"
it.options.release = 16
}

java {
withSourcesJar()

sourceCompatibility = JavaVersion.VERSION_16
targetCompatibility = JavaVersion.VERSION_16

toolchain {
languageVersion = JavaLanguageVersion.of(17)
}
}

jar {
manifest {
attributes 'Implementation-Title': project.archives_base_name,
'Implementation-Version': project.version
}
}

publishing {
publications {
create("mavenJava", MavenPublication) {
artifactId = project.archives_base_name
from components.java
}
}

repositories {
}
}
