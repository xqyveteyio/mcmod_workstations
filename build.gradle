plugins {
	id 'fabric-loom' version '1.9.2'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()

	// Minecraft Comes Alive, for the optional integration that dresses workers as its villagers.
	maven {
		name = "Conczin"
		url = "https://maven.conczin.net/Artifacts"
		content {
			includeGroup "net.mca"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Compile only, and never listed as a dependency: the classes that touch it are reached solely
	// through a mod loaded check, so the mod runs identically with MCA absent.
	//
	// Not transitive. MCA is built on Architectury, but none of the handful of its types we name
	// carry an Architectury type in their signature, so pulling the whole platform in to compile
	// against would buy nothing but another repository to depend on.
	modCompileOnly("net.mca:mca:${project.mca_version}") {
		transitive = false
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17

	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

jar {
	manifest {
		attributes 'Implementation-Title': project.archives_base_name,
				'Implementation-Version': project.version
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
