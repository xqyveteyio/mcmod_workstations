modLoader = "javafml"
loaderVersion = "[36,)"
license = "MIT"

[[mods]]
modId = "villager_workstations"
version = "${version}"
displayName = "Workstations"
authors = "keyboard"
description = '''
Work stations that each summon a worker to run the ground around them. The ranch station's rancher breeds, culls, shears and milks the animals in its pen; the farm station's farmer tills, sows and harvests its plots; the lumber station's lumberjack fells trees and plants saplings. Every station is configured in place and highlights the area it works.
'''

[[dependencies.villager_workstations]]
modId = "forge"
mandatory = true
versionRange = "[36,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.villager_workstations]]
modId = "minecraft"
